<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login — Nashvell International Trading Co. Ltd.</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="./photo/logo.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div id="preloader"><div class="loader-ring"></div></div>

  <nav id="mainNav" class="navbar navbar-expand-xxl fixed-top">
    <div class="container-fluid px-4 px-xl-5">
      <a class="navbar-brand" href="index.html">
        <div class="brand-icon">
          <img src="./photo/logo.png" alt="Nashvell Logo" class="brand-logo" />
        </div>
        <div class="brand-text">
          <span class="brand-name">NASHVELL</span>
          <span class="brand-tagline">International Trading Co. Ltd.</span>
        </div>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-label="Toggle navigation">
        <i class="bi bi-list text-white fs-2"></i>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav mx-auto gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="auth-page-section bg-primary-dark">
    <div class="container-fluid px-4 px-xl-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="contact-form-card auth-card" data-aos="fade-up">
            <div class="text-center mb-4">
              <img src="./photo/logo.png" class="auth-logo" alt="Nashvell Logo" />
              <h2 class="section-title text-white" style="font-size:1.6rem;">Staff Login</h2>
              <p style="color:rgba(255,255,255,0.5);font-size:0.9rem;margin-bottom:0;">Sign in to manage products</p>
            </div>

            <div id="loginError" class="form-error" style="display:none;"></div>

            <form id="loginForm" novalidate>
              <div class="form-group-custom">
                <label class="form-label-custom" for="loginEmail">Email</label>
                <input type="email" id="loginEmail" class="form-control-custom" required autocomplete="username" />
              </div>
              <div class="form-group-custom">
                <label class="form-label-custom" for="loginPassword">Password</label>
                <input type="password" id="loginPassword" class="form-control-custom" required autocomplete="current-password" />
              </div>
              <button type="submit" class="btn-gold btn-ripple w-100">Sign In</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="./main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-client.js"></script>
  <script src="./runtime-check.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
